name: Verify BotConnector Device CLI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-cli:
    name: Installer-free device CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify device CLI
        run: npm run check:device

      - name: Verify CLI help
        run: node cli/botconnector-device.cjs --help

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Build installer-free device package
        run: |
          mkdir -p dist/device
          npm pack --pack-destination dist/device
          mv dist/device/botconnector-device-*.tgz dist/device/device-cli.tgz
          sha256sum dist/device/device-cli.tgz

      - name: Verify fresh TGZ install
        shell: bash
        run: |
          set -euo pipefail
          fresh="${RUNNER_TEMP}/botconnector-device-fresh"
          rm -rf "$fresh"
          mkdir -p "$fresh"
          npm install --prefix "$fresh" "$GITHUB_WORKSPACE/dist/device/device-cli.tgz" --ignore-scripts
          expected="$(node -p "require('./package.json').version")"
          actual="$(node "$fresh/node_modules/botconnector-device/cli/botconnector-device.cjs" --version)"
          test "$actual" = "$expected"
          node "$fresh/node_modules/botconnector-device/cli/botconnector-device.cjs" --help >/dev/null

      - name: Verify stable launcher
        run: node --test launcher/cli.test.cjs

      - name: Build stable launcher package
        shell: bash
        run: |
          set -euo pipefail
          npm pack ./launcher --pack-destination dist/device
          mv dist/device/botconnector-device-launcher-*.tgz dist/device/device-cli-launcher.tgz
          tar -tzf dist/device/device-cli-launcher.tgz | grep -q '^package/cli.cjs
        uses: actions/upload-artifact@v4
        with:
          name: botconnector-device-cli
          path: |
            dist/device/device-cli.tgz
            dist/device/device-cli-launcher.tgz
          if-no-files-found: error
          retention-days: 14


  windows-hardware:
    name: Windows hardware detection
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Detect Windows hardware
        shell: pwsh
        run: |
          node -e "require('./desktop/local/hardware.cjs').detectHardware().then(h => { console.log(JSON.stringify(h, null, 2)); if (!h.cpu || !h.ramGb || h.platform !== 'win32') process.exit(1); })"

      - name: Smoke test Windows Local AI module
        shell: pwsh
        run: |
          node -e "const os=require('node:os'); const path=require('node:path'); const {LocalAiRuntime}=require('./cli/local-runtime.cjs'); new LocalAiRuntime({enabled:true,dataDir:path.join(os.tmpdir(),'botconnector-device-ci')}).status().then(s=>{console.log(JSON.stringify(s,null,2)); if(typeof s.available!=='boolean') process.exit(1);})"

      - name: Smoke test Windows offline browser UI
        shell: pwsh
        run: |
          node --test cli/offline-server.test.cjs

          sha256sum dist/device/device-cli-launcher.tgz

      - name: Upload device package
        uses: actions/upload-artifact@v4
        with:
          name: botconnector-device-cli
          path: dist/device/device-cli.tgz
          if-no-files-found: error
          retention-days: 14


  windows-hardware:
    name: Windows hardware detection
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Detect Windows hardware
        shell: pwsh
        run: |
          node -e "require('./desktop/local/hardware.cjs').detectHardware().then(h => { console.log(JSON.stringify(h, null, 2)); if (!h.cpu || !h.ramGb || h.platform !== 'win32') process.exit(1); })"

      - name: Smoke test Windows Local AI module
        shell: pwsh
        run: |
          node -e "const os=require('node:os'); const path=require('node:path'); const {LocalAiRuntime}=require('./cli/local-runtime.cjs'); new LocalAiRuntime({enabled:true,dataDir:path.join(os.tmpdir(),'botconnector-device-ci')}).status().then(s=>{console.log(JSON.stringify(s,null,2)); if(typeof s.available!=='boolean') process.exit(1);})"

      - name: Smoke test Windows offline browser UI
        shell: pwsh
        run: |
          node --test cli/offline-server.test.cjs
