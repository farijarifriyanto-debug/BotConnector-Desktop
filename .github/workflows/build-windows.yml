name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify JavaScript and device bridge
        run: npm run check

      - name: Verify Rust
        run: cargo test --locked

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem dist/desktop -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotConnector-Windows-x64
          path: dist/desktop/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem dist/desktop -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
            ForEach-Object { $_.FullName }
          if (-not $assets) { throw "No release assets found." }
          gh release create $tag @assets --generate-notes --title "BotConnector Desktop $tag"
