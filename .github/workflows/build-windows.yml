name: Legacy Windows Desktop (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Optional Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify JavaScript
        run: npm run check

      - name: Verify Rust
        run: cargo test --locked

      - name: Build optional Windows installer
        run: npm run dist

      - name: Upload optional installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotConnector-Windows-x64-legacy
          path: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/*.yml
          if-no-files-found: error
          retention-days: 7
