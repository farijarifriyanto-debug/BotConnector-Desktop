name: Build Local UI POC

on:
  push:
    branches:
      - "poc/open-webui-local-ui-action"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Open WebUI ref to build (keep at v0.6.5 unless license review says otherwise)"
        required: true
        default: "v0.6.5"

permissions:
  contents: read

jobs:
  build-local-ui:
    name: Build Open WebUI frontend POC
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout BotConnector
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout pinned Open WebUI source
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.upstream_ref }}"
          if [ "$ref" != "v0.6.5" ]; then
            echo "::error::POC is intentionally pinned to v0.6.5 for the BSD-3-Clause baseline."
            exit 1
          fi
          git clone --filter=blob:none --no-checkout https://github.com/open-webui/open-webui.git upstream/open-webui
          git -C upstream/open-webui checkout --detach "$ref"
          git -C upstream/open-webui rev-parse HEAD | tee upstream/open-webui/UPSTREAM_COMMIT

      - name: Verify license baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/open-webui/LICENSE
          grep -Eqi "BSD|Redistribution and use in source and binary forms" upstream/open-webui/LICENSE
          cp upstream/open-webui/LICENSE upstream/open-webui/UPSTREAM_LICENSE.txt

      - name: Install frontend dependencies
        working-directory: upstream/open-webui
        run: npm ci --force

      - name: Build frontend
        working-directory: upstream/open-webui
        env:
          APP_BUILD_HASH: botconnector-local-ui-poc
        run: npm run build

      - name: Create portable static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/local-ui-poc
          mkdir -p dist/local-ui-poc
          cp -a upstream/open-webui/build/. dist/local-ui-poc/
          find dist/local-ui-poc -type f -name '*.map' -delete

          cp upstream/open-webui/UPSTREAM_LICENSE.txt dist/local-ui-poc/OPEN_WEBUI_BSD_LICENSE.txt

          commit="$(cat upstream/open-webui/UPSTREAM_COMMIT)"
          cat > dist/local-ui-poc/BOTCONNECTOR_LOCAL_UI_POC.json <<EOF
          {
            "kind": "botconnector-local-ui-poc",
            "upstream": "open-webui/open-webui",
            "upstream_ref": "v0.6.5",
            "upstream_commit": "$commit",
            "runtime": "static-browser-assets-only",
            "backend": "not-bundled",
            "deployment": "none"
          }
          EOF

          tar -C dist -czf dist/botconnector-local-ui-poc.tgz local-ui-poc
          sha256sum dist/botconnector-local-ui-poc.tgz | tee dist/botconnector-local-ui-poc.sha256
          du -sh dist/local-ui-poc dist/botconnector-local-ui-poc.tgz

      - name: Upload Local UI POC artifact
        uses: actions/upload-artifact@v4
        with:
          name: botconnector-local-ui-poc
          path: |
            dist/botconnector-local-ui-poc.tgz
            dist/botconnector-local-ui-poc.sha256
          if-no-files-found: error
          retention-days: 14
